<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Experience</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      background: #050505;
      color: white;
      font-family: Arial, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .container {
      text-align: center;
    }

    h1 {
      font-size: 50px;
      margin-bottom: 15px;
    }

    p {
      color: #999;
      font-size: 18px;
    }

    .orb {
      width: 180px;
      height: 180px;
      margin: 40px auto;
      border-radius: 50%;
      background: radial-gradient(
        circle at 35% 35%,
        #ffffff,
        #6c63ff 20%,
        #271f9b 45%,
        #050505 70%
      );

      box-shadow:
        0 0 30px #6c63ff,
        0 0 80px #4338ca,
        0 0 150px #312e81;

      animation: float 4s ease-in-out infinite;
    }

    @keyframes float {
      0%, 100% {
        transform: translateY(0) scale(1);
      }

      50% {
        transform: translateY(-20px) scale(1.08);
      }
    }
  </style>
</head>

<body>

  <div class="container">

    <h1>AI Experience</h1>

    <div class="orb"></div>

    <p>Something intelligent is coming...</p>

  </div>

</body>
</html>
